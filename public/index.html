<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit Wall</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css?v=8">
<link rel="stylesheet" href="/assets/dashboard.css?v=6">
</head>
<body>
<header class="appbar" id="appbar"></header>
<div class="wrap">

  <div class="sect" id="democtl"></div>

  <div class="sect" id="alerts" hidden></div>

  <div class="sect">
    <div class="kpis" id="kpis">
      <div class="kpi sk skblock"></div>
      <div class="kpi sk skblock"></div>
      <div class="kpi sk skblock"></div>
      <div class="kpi sk skblock"></div>
    </div>
  </div>

  <div class="sect" id="warmup">
    <div class="secthead">
      <h2>Warmup</h2>
      <span class="sub" id="warmupSub"></span>
      <a class="more" href="/glossary.html">What is warmup?</a>
    </div>
    <div id="warmupChart"><div class="panel sk skpanel"></div></div>
  </div>

  <div class="sect">
    <div class="secthead">
      <h2>Accounts</h2>
      <span class="sub" id="acctSub"></span>
    </div>
    <div class="cardgrid acctlist" id="warming">
      <div class="card sk skblock"></div>
      <div class="card sk skblock"></div>
    </div>
    <div class="parkhead" id="parkhead" hidden>Parked (not running yet)</div>
    <div class="cardgrid acctlist" id="parked"></div>
  </div>

  <div class="sect">
    <div class="secthead">
      <h2>Pipeline</h2>
      <span class="sub" id="pipeSub"></span>
    </div>
    <div id="statusPanel"><div class="panel"><div class="sk skrow"></div><div class="sk skrow" style="width:70%"></div></div></div>
    <div class="covrow" id="covrow"></div>
  </div>

  <div class="sect">
    <div class="secthead">
      <h2>Activity</h2>
    </div>
    <div class="grid2">
      <div class="panel">
        <ul class="feed" id="events">
          <li><span class="sk" style="width:100%;height:16px"></span></li>
          <li><span class="sk" style="width:85%;height:16px"></span></li>
          <li><span class="sk" style="width:92%;height:16px"></span></li>
        </ul>
      </div>
      <div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>When</th><th>Route</th><th>Subject</th></tr></thead>
            <tbody id="warmupMsgs"><tr><td colspan="3" class="loading">Loading&hellip;</td></tr></tbody>
          </table>
        </div>
        <div class="lgnd">Latest warmup mail: our own accounts emailing each other so inbox providers learn to trust them. None of this goes to prospects.</div>
      </div>
    </div>
  </div>

</div>
<nav class="tabbar" id="tabbar"></nav>

<script src="/assets/app.js?v=8"></script>
<script src="/assets/dashboard.js?v=6"></script>
<script src="/assets/demo.js?v=1"></script>
</body>
</html>
