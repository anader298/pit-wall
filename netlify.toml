[build]
  publish = "public"
  command = ""

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301

# Asset URLs carry a ?v=N query; bump it on every page when a file changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
